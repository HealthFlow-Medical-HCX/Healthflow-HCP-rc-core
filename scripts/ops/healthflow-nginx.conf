# HealthFlow HCP Registry - nginx reverse proxy
# Single entry point on 80/443. Hostname-based routing (works once DNS resolves);
# IP-based access also works via the default_server block.

# ---- upstreams ----
upstream registry_up  { server 127.0.0.1:8081; }
upstream keycloak_up  { server 127.0.0.1:8080; }

# ACME challenge webroot shared by all server blocks
# (certbot --webroot -w /var/www/letsencrypt)

# ---- HTTP :80 ----
server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;

    # Let's Encrypt HTTP-01 challenge (ready for when DNS resolves)
    location /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
    }

    # Everything else -> redirect to HTTPS
    location / {
        return 301 https://$host$request_uri;
    }
}

# ---- HTTPS :443 default (IP access) -> registry ----
server {
    listen 443 ssl default_server;
    listen [::]:443 ssl default_server;
    server_name _;

    ssl_certificate     /etc/nginx/ssl/healthflow-selfsigned.crt;
    ssl_certificate_key /etc/nginx/ssl/healthflow-selfsigned.key;
    include /etc/nginx/snippets/ssl-params.conf;

    client_max_body_size 25m;

    location / {
        proxy_pass http://registry_up;
        include /etc/nginx/snippets/proxy-params.conf;
    }
}

# ---- registry.healthflow.eg ----
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name registry.healthflow.eg api.sunbird.healthflow.eg sunbird.healthflow.eg;

    ssl_certificate     /etc/nginx/ssl/healthflow-selfsigned.crt;
    ssl_certificate_key /etc/nginx/ssl/healthflow-selfsigned.key;
    include /etc/nginx/snippets/ssl-params.conf;

    client_max_body_size 25m;

    location / {
        proxy_pass http://registry_up;
        include /etc/nginx/snippets/proxy-params.conf;
    }
}

# ---- keycloak.healthflow.eg ----
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name keycloak.healthflow.eg admin.healthflow.eg;

    ssl_certificate     /etc/nginx/ssl/healthflow-selfsigned.crt;
    ssl_certificate_key /etc/nginx/ssl/healthflow-selfsigned.key;
    include /etc/nginx/snippets/ssl-params.conf;

    client_max_body_size 25m;

    location / {
        proxy_pass http://keycloak_up;
        include /etc/nginx/snippets/proxy-params.conf;
        # Keycloak needs these to build correct issuer/redirect URLs behind a proxy
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Port  443;
    }
}
