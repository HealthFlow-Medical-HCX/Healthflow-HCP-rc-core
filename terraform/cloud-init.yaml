#cloud-config
# =============================================================================
# HealthFlow HCP Registry - Cloud-Init (Terraform)
# =============================================================================
# Self-contained: the runtime files are injected as base64 by Terraform
# (see main.tf -> templatefile vars), so the droplet never clones this
# private repository. All container images come from public registries.
# =============================================================================

write_files:
  - path: /opt/healthflow/docker/docker-compose.production.yml
    encoding: b64
    content: ${compose_b64}

  - path: /opt/healthflow/docker/scripts/init-db.sql
    encoding: b64
    content: ${initdb_b64}

  - path: /opt/healthflow/provision-droplet.sh
    encoding: b64
    permissions: '0755'
    content: ${provision_b64}

runcmd:
  - [ bash, /opt/healthflow/provision-droplet.sh ]

final_message: |
  HealthFlow HCP Registry provisioning finished.
  - Credentials:   /opt/healthflow/credentials.txt
  - Provision log: /var/log/healthflow-provision.log
  - Status:        cd /opt/healthflow/docker && docker compose -f docker-compose.production.yml ps
